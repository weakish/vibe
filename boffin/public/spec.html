<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e1014" media="(prefers-color-scheme: dark)" />
    <!-- theme-init -->
    <meta name="robots" content="noindex, nofollow" />
    <title>Spec · Boffin</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="title-block">
          <h1 class="title" id="spec-title">Spec</h1>
        </div>
        <div class="topbar-actions">
          <a class="pill-button" id="spec-back" href="/">Chat</a>
          <button type="button" class="pill-button" id="spec-edit">Edit</button>
          <button type="button" class="pill-button" id="spec-save" hidden>Save</button>
          <button type="button" class="pill-button" id="spec-cancel" hidden>Cancel</button>
        </div>
      </header>
      <p class="status" id="spec-status" role="status" hidden></p>
      <main class="messages" id="spec-view">
        <article class="md spec-doc" id="spec-rendered"></article>
      </main>
      <textarea id="spec-editor" class="spec-editor" hidden spellcheck="true"></textarea>
    </div>
    <script type="module" src="/spec.js"></script>
  </body>
</html>
