          <header class="topbar">
            <div class="title-block">
              <h2 class="title" id="demo-title">Boffin</h2>
              <p class="people" id="demo-people"></p>
            </div>
            <div class="topbar-actions">
              <button type="button" class="pill-button" id="demo-spec-back" hidden>Chat</button>
              <button type="button" class="pill-button" id="demo-spec-edit" hidden>Edit</button>
              <div class="settings-host">
                <button
                  type="button"
                  class="icon-button"
                  id="demo-settings"
                  aria-expanded="false"
                  aria-controls="demo-settings-panel"
                  aria-label="Settings"
                >
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path
                      d="M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4Z"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="1.8"
                    />
                    <path
                      d="M19.4 13a7.7 7.7 0 0 0 .06-2l1.74-1.32-1.8-3.12-2.06.62a7.8 7.8 0 0 0-1.73-1l-.28-2.14h-3.66l-.28 2.14a7.8 7.8 0 0 0-1.73 1l-2.06-.62-1.8 3.12L7.54 11a7.7 7.7 0 0 0 .06 2l-1.74 1.32 1.8 3.12 2.06-.62c.52.42 1.1.76 1.73 1l.28 2.14h3.66l.28-2.14c.63-.24 1.21-.58 1.73-1l2.06.62 1.8-3.12L19.4 13Z"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="1.8"
                      stroke-linejoin="round"
                    />
                  </svg>
                </button>
                <div class="menu-panel" id="demo-settings-panel" hidden>
                  <div class="menu-field">
                    <span id="demo-theme-label">Theme</span>
                    <div class="theme-picker" id="demo-theme" role="radiogroup" aria-labelledby="demo-theme-label"></div>
                  </div>
                  <div class="menu-field">
                    <span id="demo-size-label">Size</span>
                    <div class="theme-picker" id="demo-size" role="radiogroup" aria-labelledby="demo-size-label"></div>
                  </div>
                  <div class="menu-field">
                    <span id="demo-locale-label">Language</span>
                    <div class="lang-picker" id="demo-locale" role="radiogroup" aria-labelledby="demo-locale-label" aria-orientation="vertical"></div>
                  </div>
                  <button type="button" class="menu-action" id="demo-export">Export</button>
                  <button type="button" class="menu-action" id="demo-members">Members</button>
                  <button type="button" class="menu-action" id="demo-passkeys">Passkeys</button>
                  <button type="button" class="menu-action" id="demo-log-out">Log out</button>
                  <button type="button" class="menu-action" id="demo-spec">Spec</button>
                </div>
              </div>
            </div>
          </header>
          <div class="messages" id="demo-messages">
            <div class="transcript" id="demo-transcript"></div>
            <div class="typing" id="demo-typing" hidden aria-label="The agent is working">
              <span></span><span></span><span></span>
            </div>
          </div>
          <div class="messages" id="demo-spec-view" hidden>
            <p class="status" id="demo-spec-status" role="status" hidden></p>
            <article class="md spec-doc" id="demo-spec-rendered" dir="auto"></article>
          </div>
          <div class="composer" id="demo-composer">
            <div class="composer-row">
              <button type="button" class="attach-button" id="demo-attach" aria-label="Attach files">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M8.2 12.4 14.4 6.2a3.1 3.1 0 0 1 4.4 4.4l-7.9 7.9a4.3 4.3 0 0 1-6.1-6.1l7.1-7.1" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
              </button>
              <textarea
                id="demo-input"
                rows="1"
                placeholder="Message the agent"
                aria-label="Message"
              ></textarea>
              <button type="button" class="send-button" id="demo-send" disabled aria-label="Send">
                <svg class="icon-send" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M12 19V5M5.5 11.5 12 5l6.5 6.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
              </button>
            </div>
          </div>
          <dialog class="sheet" id="demo-passkeys-dialog" aria-labelledby="demo-passkeys-title" aria-describedby="demo-passkeys-body">
            <div class="login-card">
              <h2 id="demo-passkeys-title">Passkeys</h2>
              <p id="demo-passkeys-body">In the real application, you can manage your passkeys here.</p>
              <button type="button" class="ghost-button" id="demo-passkeys-close">Cancel</button>
            </div>
          </dialog>
          <dialog class="sheet" id="demo-attach-dialog" aria-labelledby="demo-attach-title" aria-describedby="demo-attach-body">
            <div class="login-card">
              <h2 id="demo-attach-title">Attach files</h2>
              <p id="demo-attach-body">In the real application, you can attach files here.</p>
              <button type="button" class="ghost-button" id="demo-attach-close">Cancel</button>
            </div>
          </dialog>
          <dialog class="sheet" id="demo-invite-dialog" aria-labelledby="demo-invite-title" aria-describedby="demo-invite-body">
            <div class="login-card">
              <h2 id="demo-invite-title">Invite</h2>
              <p id="demo-invite-body">In the real application, you can generate an invitation link here.</p>
              <button type="button" class="ghost-button" id="demo-invite-close">Cancel</button>
            </div>
          </dialog>
          <dialog class="sheet" id="demo-log-out-dialog" aria-labelledby="demo-log-out-title" aria-describedby="demo-log-out-body">
            <div class="login-card">
              <h2 id="demo-log-out-title">Log out</h2>
              <p id="demo-log-out-body">In the real application, you can log out here.</p>
              <button type="button" class="ghost-button" id="demo-log-out-close">Cancel</button>
            </div>
          </dialog>
