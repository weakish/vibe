<div class="app" id="app" inert>
      <header class="topbar">
        <div class="title-block">
          <h1 class="title">Boffin</h1>
          <p class="people" id="people-line" hidden></p>
        </div>
        <div class="topbar-actions">
          <div class="settings-host">
            <button
              type="button"
              class="icon-button"
              id="settings"
              aria-expanded="false"
              aria-controls="settings-panel"
              aria-label="Settings"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path
                  d="M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4Z"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                />
                <path
                  d="M19.4 13a7.7 7.7 0 0 0 .06-2l1.74-1.32-1.8-3.12-2.06.62a7.8 7.8 0 0 0-1.73-1l-.28-2.14h-3.66l-.28 2.14a7.8 7.8 0 0 0-1.73 1l-2.06-.62-1.8 3.12L7.54 11a7.7 7.7 0 0 0 .06 2l-1.74 1.32 1.8 3.12 2.06-.62c.52.42 1.1.76 1.73 1l.28 2.14h3.66l.28-2.14c.63-.24 1.21-.58 1.73-1l2.06.62 1.8-3.12L19.4 13Z"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linejoin="round"
                />
              </svg>
            </button>
            <div class="menu-panel" id="settings-panel" hidden>
              <div class="menu-field">
                <span id="theme-label">Theme</span>
                <div class="theme-picker" id="theme" role="radiogroup" aria-labelledby="theme-label"></div>
              </div>
              <div class="menu-field">
                <span id="size-label">Size</span>
                <div class="theme-picker" id="size" role="radiogroup" aria-labelledby="size-label"></div>
              </div>
              <div class="menu-field">
                <span id="locale-label">Language</span>
                <div class="lang-picker" id="locale" role="radiogroup" aria-labelledby="locale-label" aria-orientation="vertical"></div>
              </div>
              <div class="menu-field" id="usage-field" hidden>
                <p class="status" id="usage-refresh-status" role="status" hidden></p>
                <button type="button" class="menu-action" id="usage-refresh" hidden>Refresh</button>
              </div>
              <div class="menu-field" id="static-assets-field" hidden>
                <span id="static-assets-label">Static assets</span>
                <div class="theme-picker" id="static-assets" role="radiogroup" aria-labelledby="static-assets-label"></div>
                <p class="status" id="static-assets-status" role="status" hidden></p>
              </div>
              <button type="button" class="menu-action" id="export-log" disabled>Export</button>
              <button type="button" class="menu-action" id="people" hidden>Members</button>
              <button type="button" class="menu-action" id="passkeys" hidden>Passkeys</button>
              <button type="button" class="menu-action" id="log-out">Log out</button>
              <a class="menu-action" id="spec-link" href="/spec">Spec</a>
            </div>
          </div>
          <button type="button" class="pill-button" id="new-chat">New chat</button>
        </div>
        <div class="usage" id="usage-line" hidden>
          <div
            class="usage-bar"
            id="usage-bar"
            role="meter"
            tabindex="0"
            aria-valuemin="0"
            aria-valuemax="100"
            aria-label="Usage"
          >
            <span class="usage-bar-fill" id="usage-bar-fill"></span>
          </div>
          <p class="usage-tip" id="usage-tip" aria-hidden="true"></p>
        </div>
      </header>

      <p class="status" id="status" role="status" hidden></p>

      <main class="conversation-list" id="conversation-list" hidden>
        <h2 id="conversation-list-title">Conversations</h2>
        <div id="conversation-entries"></div>
      </main>

      <main class="messages" id="messages">
        <div class="empty" id="empty">
          <p class="empty-title" id="empty-title">The LORD bless thee, and keep thee.</p>
        </div>
        <div class="transcript" id="transcript" role="log" aria-live="polite"></div>
        <div class="typing" id="typing" hidden aria-label="The agent is working">
          <span></span><span></span><span></span>
        </div>
      </main>

      <div class="composer">
        <div class="pending" id="pending" hidden></div>
        <div class="composer-row">
          <label class="attach-button" id="attach" aria-label="Attach files">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M8.2 12.4 14.4 6.2a3.1 3.1 0 0 1 4.4 4.4l-7.9 7.9a4.3 4.3 0 0 1-6.1-6.1l7.1-7.1" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
            <input id="files" type="file" multiple tabindex="-1" />
          </label>
          <textarea
            id="input"
            rows="1"
            placeholder="Message the agent"
            aria-label="Message"
            maxlength="32768"
            autocomplete="off"
            autocapitalize="sentences"
            enterkeyhint="enter"
          ></textarea>
          <button type="button" class="send-button" id="send" aria-label="Send">
            <svg class="icon-send" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 19V5M5.5 11.5 12 5l6.5 6.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
            <svg class="icon-stop" viewBox="0 0 24 24" aria-hidden="true">
              <rect x="6.5" y="6.5" width="11" height="11" rx="2.5" fill="currentColor" />
            </svg>
          </button>
        </div>
      </div>
    </div>

    <dialog class="sheet" id="passkeys-dialog" aria-labelledby="passkeys-title">
      <div class="login-card">
        <h2 id="passkeys-title">Passkeys</h2>
        <ul class="people-list" id="passkey-entries"></ul>
        <input
          id="passkey-label"
          type="text"
          maxlength="40"
          autocomplete="off"
          spellcheck="false"
          enterkeyhint="done"
          placeholder="Label"
          aria-label="Label"
        />
        <p class="status-line" id="passkeys-status" role="status"></p>
        <button type="button" class="primary-button" id="passkey-add">Add passkey</button>
        <button type="button" class="ghost-button" id="passkeys-close">Cancel</button>
      </div>
    </dialog>

    <dialog class="sheet" id="new-chat-dialog" aria-labelledby="new-chat-title" aria-describedby="new-chat-body">
      <div class="login-card">
        <h2 id="new-chat-title">New chat</h2>
        <p id="new-chat-body">Start a new chat? The current conversation will be cleared.</p>
        <div class="menu-field" id="new-chat-agent-field" hidden>
          <span id="new-chat-agent-label">Agent</span>
          <div class="theme-picker" id="new-chat-agent" role="radiogroup" aria-labelledby="new-chat-agent-label"></div>
        </div>
        <div class="menu-field" id="new-chat-model-field">
          <span id="new-chat-model-label">Model</span>
          <div class="theme-picker" id="new-chat-model" role="radiogroup" aria-labelledby="new-chat-model-label"></div>
        </div>
        <div class="sheet-actions">
          <button type="button" class="primary-button" id="new-chat-export" data-action="export">Export log and start</button>
          <button type="button" class="secondary-button" id="new-chat-clear" data-action="clear">Start without exporting</button>
          <button type="button" class="ghost-button" id="new-chat-cancel" data-action="cancel">Cancel</button>
        </div>
      </div>
    </dialog>
